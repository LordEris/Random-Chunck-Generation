# Temporary: dumps the Minecraft 26.3 API into the job logs. Removed before merging.
name: Probe

on:
  push:
    branches: ['dev/**']

jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [g, h, i, j]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Fetch Minecraft 26.3 and Vineflower
        run: |
          set -euo pipefail
          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o manifest.json
          curl -fsSL "$(jq -r '.versions[] | select(.id=="26.3") | .url' manifest.json)" -o version.json
          curl -fsSL "$(jq -r '.downloads.client.url' version.json)" -o client.jar
          curl -fsSL https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar -o vineflower.jar
          jq '{javaVersion, mainClass}' version.json
          ls -l client.jar vineflower.jar

      - name: Dump group ${{ matrix.group }}
        run: bash .github/probe.sh ${{ matrix.group }} "$PWD/client.jar" "$PWD/vineflower.jar"
