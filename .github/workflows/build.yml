name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - name: Read the plugin version
        id: plugin
        run: echo "version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Upload the plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: randomchunks
          path: RandomChunks-*.jar
          if-no-files-found: error

      - name: Publish it as a directly downloadable jar
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.plugin.outputs.version }}
          name: v${{ steps.plugin.outputs.version }}
          body: |
            Download the `.jar` below and drop it straight into your server's `plugins/`
            folder.

            Spigot / Paper, Minecraft 1.21.
          prerelease: false
          files: RandomChunks-*.jar
          fail_on_unmatched_files: true
